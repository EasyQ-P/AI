[project]
name = "easyq-ai"
version = "0.1.0"
description = "EasyQ AI학습서버(trainer)와 공용 검색 패키지(retrieval)"
requires-python = ">=3.12"
dependencies = ["easyq-trainer", "retrieval"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["retrieval", "trainer"]

[tool.uv.sources]
easyq-trainer = { workspace = true }
retrieval = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "httpx>=0.27"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "modules", "retrieval"]

[tool.pytest.ini_options]
testpaths = ["retrieval/tests", "trainer/tests"]
