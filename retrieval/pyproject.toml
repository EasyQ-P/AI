[project]
name = "retrieval"
version = "0.1.0"
description = "EasyQ 공용 검색 패키지: 교안 · 발화 청킹, 키워드 색인, 하이브리드 검색, 겹침 계산 (6.1.5)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# 형태소 분석 키워드 색인 (Kiwi). 겹침 계산 · 설정만 쓸 때는 필요 없다.
keyword = ["kiwipiepy>=0.18"]
# Gemini 임베딩 (백엔드 · 로컬 데이터 작업). 학과 서버(Python 3.9)에는 설치하지 않는다.
embedding = ["google-genai>=1.0; python_version >= '3.10'"]
# 교안 청킹 토큰 수 (bge-reranker-v2-m3 토크나이저)
tokenizer = ["tokenizers>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]
