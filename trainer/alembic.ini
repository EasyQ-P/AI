# Registry DB migrations (design 8.2.38, reg_ tables).
# Keep this file ASCII only: alembic reads it with the OS locale encoding (cp949 on Korean Windows).
# The DB URL is not stored here; migrations/env.py reads REGISTRY_DB_URL from .env.
#
# From the repo root:
#   uv run alembic -c trainer/alembic.ini revision --autogenerate -m "message"
#   uv run alembic -c trainer/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
