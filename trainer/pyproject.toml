[project]
name = "easyq-trainer"
version = "0.1.0"
description = "EasyQ AI학습서버: 학습서버 API(/api/v1)와 데이터셋 · 학습 · 평가 · 변환 · 추론 · 장애 모듈 (7.4)"
requires-python = ">=3.12"
dependencies = [
    "retrieval",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
# 학과 서버(GPU)에서만 설치: uv sync --extra gpu
gpu = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
]

[tool.uv.sources]
retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "modules"]
